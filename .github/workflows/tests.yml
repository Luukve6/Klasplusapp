# Bij elke push naar main: typecontrole en de automatische tests (rekenregels zoals de Examencheck,
# tussenuren, de ochtendmelding en de updatecheck). Een rood kruisje op GitHub betekent: er is iets stuk.

name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecontrole
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
